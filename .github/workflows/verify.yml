name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install -e ".[dev,browser]" build
      - run: python -m pip check
      - run: ruff check src tests --select E4,E7,E9,F,I
      - run: python -m pytest -q -m "not browser" -p no:cacheprovider --basetemp .pytest-run-ci
      - run: python -m build --wheel
      - run: python -m pip install --force-reinstall --no-deps dist/agentic_revenue_system-0.1.0-py3-none-any.whl
      - name: Verify installed wheel outside checkout
        shell: bash
        run: cd "${RUNNER_TEMP}" && python -m revenue_system.cli validate-packs
      - name: Browser regression
        if: runner.os == 'Windows'
        run: python -m pytest -q -m browser -p no:cacheprovider --basetemp .pytest-run-browser-ci
