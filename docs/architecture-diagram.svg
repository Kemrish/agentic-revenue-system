<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172033}.title{font-size:28px;font-weight:bold}.box{stroke:#23395d;stroke-width:2;rx:12}.small{font-size:15px}.arrow{stroke:#526581;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526581"/></marker></defs><text x="40" y="45" class="title">Agentic Revenue System Architecture</text><rect x="40" y="80" width="1120" height="85" class="box" fill="#e8f1ff"/><text x="600" y="115" text-anchor="middle">External Sources</text><text x="600" y="143" text-anchor="middle" class="small">CRM · imports · webhooks · fixtures</text><line x1="600" y1="165" x2="600" y2="205" class="arrow"/><rect x="40" y="205" width="1120" height="75" class="box" fill="#eef7ee"/><text x="600" y="250" text-anchor="middle">Durable Events and Operational Store</text><line x1="600" y1="280" x2="600" y2="320" class="arrow"/><rect x="40" y="320" width="1120" height="85" class="box" fill="#fff5dc"/><text x="600" y="355" text-anchor="middle">Orchestrator</text><text x="600" y="383" text-anchor="middle" class="small">deal state · lifecycle stages · event handling</text><line x1="600" y1="405" x2="600" y2="445" class="arrow"/><rect x="40" y="445" width="350" height="105" class="box" fill="#f1eaff"/><text x="215" y="480" text-anchor="middle">AI Agents</text><text x="215" y="510" text-anchor="middle" class="small">reasoning and proposals</text><text x="215" y="532" text-anchor="middle" class="small">outreach · triage · calls · IO</text><rect x="425" y="445" width="350" height="105" class="box" fill="#eafff8"/><text x="600" y="480" text-anchor="middle">Deterministic Skills</text><text x="600" y="510" text-anchor="middle" class="small">scoring · validation · templates</text><text x="600" y="532" text-anchor="middle" class="small">lessons · tracking</text><rect x="810" y="445" width="350" height="105" class="box" fill="#ffecec"/><text x="985" y="480" text-anchor="middle">Governance</text><text x="985" y="510" text-anchor="middle" class="small">policy · approval · guardrails</text><text x="985" y="532" text-anchor="middle" class="small">kill switch · audit</text><line x1="215" y1="550" x2="215" y2="600" class="arrow"/><line x1="600" y1="550" x2="600" y2="600" class="arrow"/><line x1="985" y1="550" x2="985" y2="600" class="arrow"/><rect x="40" y="600" width="1120" height="70" class="box" fill="#fff5dc"/><text x="600" y="642" text-anchor="middle">Typed Proposal → Policy Decision → Approval or Outbox</text><line x1="600" y1="670" x2="600" y2="710" class="arrow"/><rect x="40" y="710" width="1120" height="70" class="box" fill="#e8f1ff"/><text x="600" y="752" text-anchor="middle">Provider Adapters: HubSpot · Resend · Fireflies · Dropbox Sign</text></svg>
