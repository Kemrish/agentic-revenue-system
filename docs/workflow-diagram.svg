<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520"><style>text{font-family:Arial,sans-serif;font-size:16px;fill:#172033}.title{font-size:27px;font-weight:bold}.box{stroke:#23395d;stroke-width:2;rx:12}.arrow{stroke:#526581;stroke-width:3;marker-end:url(#a)}.small{font-size:13px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526581"/></marker></defs><text x="40" y="40" class="title">Working Operation Flow</text><rect x="40" y="100" width="170" height="80" class="box" fill="#e8f1ff"/><text x="125" y="135" text-anchor="middle">Lead arrives</text><text x="125" y="160" text-anchor="middle" class="small">CRM / import / event</text><line x1="210" y1="140" x2="245" y2="140" class="arrow"/><rect x="245" y="100" width="170" height="80" class="box" fill="#eef7ee"/><text x="330" y="135" text-anchor="middle">Persist event</text><text x="330" y="160" text-anchor="middle" class="small">idempotent</text><line x1="415" y1="140" x2="450" y2="140" class="arrow"/><rect x="450" y="100" width="170" height="80" class="box" fill="#fff5dc"/><text x="535" y="135" text-anchor="middle">Score lead</text><text x="535" y="160" text-anchor="middle" class="small">fit · intent · tier</text><line x1="620" y1="140" x2="655" y2="140" class="arrow"/><rect x="655" y="100" width="170" height="80" class="box" fill="#f1eaff"/><text x="740" y="135" text-anchor="middle">Agent proposes</text><text x="740" y="160" text-anchor="middle" class="small">typed draft</text><line x1="825" y1="140" x2="860" y2="140" class="arrow"/><rect x="860" y="100" width="170" height="80" class="box" fill="#ffecec"/><text x="945" y="135" text-anchor="middle">Policy gate</text><text x="945" y="160" text-anchor="middle" class="small">auto / approval / deny</text><line x1="945" y1="180" x2="945" y2="260" class="arrow"/><rect x="820" y="260" width="250" height="80" class="box" fill="#ffecec"/><text x="945" y="295" text