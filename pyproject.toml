[project]
name = "agentic-revenue-system"
version = "0.1.0"
description = "Governed agentic revenue lifecycle system"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0,<3.0",
  "pydantic-settings>=2.0,<3.0",
  "python-dotenv>=1.0,<2.0",
  "typer>=0.12,<1.0",
  "jinja2>=3.1,<4.0",
  "pyyaml>=6.0,<7.0",
  "fastapi>=0.110,<1.0",
  "uvicorn>=0.29,<1.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "ruff>=0.6,<1.0",
]
live = [
  "claude-agent-sdk>=0.2.165,<0.3",
]
browser = [
  "playwright>=1.50,<2.0",
]

[project.scripts]
revenue-system = "revenue_system.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revenue_system"]

[tool.hatch.build.targets.wheel.force-include]
"packs" = "revenue_system/data/packs"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["browser: browser interaction tests (requires Playwright and Microsoft Edge)"]

