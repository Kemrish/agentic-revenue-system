x-service: &service
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: agentic-revenue-system:local
  env_file: ../.env.production
  environment:
    APP_ENV: production
    DATABASE_URL: sqlite:////data/production.db
  volumes:
    - revenue-data:/data
    - revenue-backups:/backups
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  ui:
    <<: *service
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  webhooks:
    <<: *service
    command: [python, -m, revenue_system.cli, webhooks, --host, "0.0.0.0", --port, "8001"]
    ports: ["127.0.0.1:8001:8001"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    <<: *service
    command: [python, -m, revenue_system.cli, worker, --deliver]

volumes:
  revenue-data:
  revenue-backups:
